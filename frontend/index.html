    <script>
      // Apply a saved theme before first paint so dark mode doesn't flash light.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
